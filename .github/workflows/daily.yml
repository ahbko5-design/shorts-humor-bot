name: Daily YouTube Shorts Auto-Publisher

on:
  schedule:
    # Запуск 2 раза в день (в 06:00 и 15:00 UTC = 09:00 и 18:00 по Киеву)
    - cron: '0 6,15 * * *'
  workflow_dispatch: # Сохраняет возможность запускать вручную через синюю кнопку

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install -r requirements.txt

      - name: Run Auto Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python main.py
